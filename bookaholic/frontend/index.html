<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookaholic</title>
    <link rel="stylesheet" href="style.css">
    <script src="/eel.js"></script>
    <script defer src="app.js"></script>
</head>
<body>
    <header>
        <button id="back" class="secondary">← Back</button>
        <a href="#home" class="brand">Bookaholic</a>
        <nav>
            <a href="#home">Home</a>
            <a href="#library">Library</a>
        </nav>
    </header>

    <main id="app" aria-live="polite"></main>

    <!-- Shared dialog for adding, reviewing and deleting books. -->
    <dialog id="dialog">
        <form id="dialog-form">
            <div id="dialog-content"></div>
            <p id="dialog-error" role="alert"></p>
            <div class="actions">
                <button type="button" class="secondary" id="cancel-dialog">Cancel</button>
                <button id="submit-dialog" type="submit">Save</button>
            </div>
        </form>
    </dialog>
</body>
</html>
