name: Build and release Windows EXE

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install project and build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build executable
        run: >
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name Bookaholic
          --collect-all eel
          --add-data="bookaholioc/frontend"
          bookaholic/__main__.py

      - name: Generate unique release tag and title
        shell: pwsh
        run: |
          $id = [guid]::NewGuid().ToString("N").Substring(0, 8)
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          "RELEASE_TAG=auto-$stamp-$id" >> $env:GITHUB_ENV
          "RELEASE_TITLE=Bookaholic $stamp ($id)" >> $env:GITHUB_ENV

      - name: Create GitHub Release and upload EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "dist/Bookaholic.exe" `
            --title "$env:RELEASE_TITLE" `
            --generate-notes `
            --target "${{ github.sha }}"
